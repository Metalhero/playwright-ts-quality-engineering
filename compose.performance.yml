
services:
  target:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "target.mjs"]
    volumes:
      - ./performance/target.mjs:/app/target.mjs:ro

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:13.2.6
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: localdevonly
    volumes:
      - ./monitoring/grafanaData.yml:/etc/grafana/provisioning/datasources/grafanaData.yml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

  k6:
    image: grafana/k6:2.4.0
    profiles: ["loadtest"]
    volumes:
      - ./performance:/scripts:ro
    environment:
      BASE_URL: http://target:8080
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: "p(95),p(99),avg"
    depends_on:
      - target
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
